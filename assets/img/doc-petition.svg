<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img"
     aria-labelledby="doc-petition-title doc-petition-desc">
  <title id="doc-petition-title">A federal habeas corpus petition</title>
  <desc id="doc-petition-desc">Illustration of a court filing: a numbered pleading page bearing a
    caption, the title "Petition for Writ of Habeas Corpus", body paragraphs, an embossed seal and a
    signature block.</desc>

  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCF7F2"/>
    </linearGradient>
  </defs>

  <rect width="560" height="440" fill="#F7F2ED"/>

  <!-- Two sheets behind, fanned -->
  <rect x="88" y="40" width="356" height="376" rx="2" fill="#FFFFFF" stroke="#E4DBD4"
        transform="rotate(-2.4 266 228)"/>
  <rect x="96" y="34" width="356" height="376" rx="2" fill="#FFFFFF" stroke="#E4DBD4"
        transform="rotate(1.4 274 222)"/>

  <!-- Front sheet -->
  <g>
    <rect x="102" y="28" width="356" height="384" rx="2" fill="url(#pg)" stroke="#DCD2CB"/>

    <!-- Pleading rule lines, as on numbered court paper -->
    <line x1="128" y1="28" x2="128" y2="412" stroke="#D6C4C2" stroke-width="1"/>
    <line x1="133" y1="28" x2="133" y2="412" stroke="#D6C4C2" stroke-width="1"/>
    <g fill="#A79A9C" font-family="Georgia, 'Times New Roman', serif" font-size="7"
       text-anchor="end">
      <text x="124" y="76">1</text><text x="124" y="100">2</text><text x="124" y="124">3</text>
      <text x="124" y="148">4</text><text x="124" y="172">5</text><text x="124" y="196">6</text>
      <text x="124" y="220">7</text><text x="124" y="244">8</text><text x="124" y="268">9</text>
      <text x="124" y="292">10</text><text x="124" y="316">11</text><text x="124" y="340">12</text>
    </g>

    <!-- Caption block -->
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#2A1F21">
      <text x="298" y="60" font-size="8.5" letter-spacing="1.1">UNITED STATES DISTRICT COURT</text>
      <text x="298" y="72" font-size="7.5" fill="#63535A" letter-spacing=".8">SOUTHERN DISTRICT OF FLORIDA</text>
    </g>
    <line x1="152" y1="80" x2="444" y2="80" stroke="#D6C4C2"/>

    <!-- Parties -->
    <g fill="#D6CBCB">
      <rect x="152" y="92" width="104" height="4" rx="2"/>
      <rect x="152" y="102" width="72" height="4" rx="2"/>
      <rect x="152" y="118" width="52" height="4" rx="2"/>
      <rect x="152" y="134" width="94" height="4" rx="2"/>
      <rect x="152" y="144" width="66" height="4" rx="2"/>
    </g>
    <line x1="300" y1="88" x2="300" y2="152" stroke="#E4DBD4"/>
    <g fill="#D6CBCB">
      <rect x="318" y="92" width="84" height="4" rx="2"/>
      <rect x="318" y="102" width="60" height="4" rx="2"/>
    </g>
    <line x1="152" y1="164" x2="444" y2="164" stroke="#D6C4C2"/>

    <!-- Document title -->
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="298" y="190" font-size="11.5" fill="#702732" letter-spacing=".6">PETITION FOR WRIT</text>
      <text x="298" y="205" font-size="11.5" fill="#702732" letter-spacing=".6">OF HABEAS CORPUS</text>
      <text x="298" y="221" font-size="7.5" fill="#821B25" letter-spacing="1.4">28 U.S.C. &#167; 2241</text>
    </g>

    <!-- Body paragraphs, abstracted -->
    <g fill="#DED4D3">
      <rect x="152" y="240" width="292" height="3.6" rx="1.8"/>
      <rect x="152" y="252" width="292" height="3.6" rx="1.8"/>
      <rect x="152" y="264" width="248" height="3.6" rx="1.8"/>
      <rect x="152" y="282" width="292" height="3.6" rx="1.8"/>
      <rect x="152" y="294" width="292" height="3.6" rx="1.8"/>
      <rect x="152" y="306" width="196" height="3.6" rx="1.8"/>
    </g>

    <!-- Signature block -->
    <line x1="316" y1="352" x2="444" y2="352" stroke="#2A1F21" stroke-width="1"/>
    <path d="M324 348c8-9 13 3 20-5s10 6 18-3 12 5 20-4" fill="none" stroke="#702732"
          stroke-width="1.6" stroke-linecap="round"/>
    <g fill="#D6CBCB">
      <rect x="316" y="360" width="96" height="3.4" rx="1.7"/>
      <rect x="316" y="370" width="72" height="3.4" rx="1.7"/>
    </g>

    <!-- Embossed seal -->
    <g transform="translate(190 356)">
      <circle r="27" fill="none" stroke="#A3222F" stroke-width="1.6"/>
      <circle r="21" fill="none" stroke="#A3222F" stroke-width=".8" stroke-dasharray="2 3"/>
      <path d="M-9 4V-9L0 0l9-9V4" fill="none" stroke="#A3222F" stroke-width="2.4"
            stroke-linejoin="miter"/>
      <rect x="-9" y="7" width="18" height="1.4" fill="#A3222F"/>
    </g>
  </g>
</svg>
