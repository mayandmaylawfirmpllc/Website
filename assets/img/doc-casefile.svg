<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img"
     aria-labelledby="doc-casefile-title doc-casefile-desc">
  <title id="doc-casefile-title">An employment-based immigration case file</title>
  <desc id="doc-casefile-desc">Illustration of a labour certification case file: tabbed folders
    holding an application for permanent employment certification, a recruitment record and a
    supporting evidence index, marked complete.</desc>

  <rect width="560" height="440" fill="#EFEBE6"/>

  <!-- Folder tabs -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700"
     letter-spacing="1.3" fill="#FFFFFF">
    <path d="M64 96h132l14 18h-146z" fill="#8A3040"/>
    <text x="78" y="110">RECRUITMENT</text>
    <path d="M64 74h112l14 18h-126z" fill="#702732"/>
    <text x="78" y="88">EVIDENCE</text>
  </g>

  <!-- Folder body -->
  <rect x="64" y="112" width="432" height="256" rx="3" fill="#45161E"/>
  <rect x="72" y="120" width="416" height="240" rx="2" fill="#5A1F27"/>

  <!-- Documents in the folder -->
  <rect x="112" y="72" width="308" height="284" rx="2" fill="#FFFFFF" stroke="#DCD2CB"
        transform="rotate(-1.6 266 214)"/>
  <rect x="126" y="60" width="308" height="296" rx="2" fill="#FFFFFF" stroke="#DCD2CB"/>

  <!-- Front document content -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="280" y="92" font-size="9" fill="#702732" letter-spacing=".9">APPLICATION FOR PERMANENT</text>
    <text x="280" y="105" font-size="9" fill="#702732" letter-spacing=".9">EMPLOYMENT CERTIFICATION</text>
  </g>
  <line x1="150" y1="116" x2="410" y2="116" stroke="#D6C4C2"/>

  <!-- Field rows -->
  <g>
    <g fill="#9C8E90" font-family="Helvetica, Arial, sans-serif" font-size="6.5"
       letter-spacing=".7">
      <text x="150" y="138">EMPLOYER</text>
      <text x="150" y="170">POSITION</text>
      <text x="150" y="202">WORKSITE</text>
      <text x="150" y="234">WAGE DETERMINATION</text>
    </g>
    <g fill="#FCF7F2" stroke="#E4DBD4">
      <rect x="150" y="142" width="260" height="16" rx="1.5"/>
      <rect x="150" y="174" width="260" height="16" rx="1.5"/>
      <rect x="150" y="206" width="260" height="16" rx="1.5"/>
      <rect x="150" y="238" width="150" height="16" rx="1.5"/>
    </g>
    <g fill="#D6CBCB">
      <rect x="157" y="148" width="180" height="4" rx="2"/>
      <rect x="157" y="180" width="132" height="4" rx="2"/>
      <rect x="157" y="212" width="156" height="4" rx="2"/>
      <rect x="157" y="244" width="88" height="4" rx="2"/>
    </g>
  </g>

  <!-- Checklist -->
  <g>
    <g stroke="#A3222F" stroke-width="1.4" fill="none">
      <rect x="150" y="272" width="9" height="9" rx="1"/>
      <path d="M152 277l2.6 2.6 4.4-5"/>
      <rect x="150" y="290" width="9" height="9" rx="1"/>
      <path d="M152 295l2.6 2.6 4.4-5"/>
      <rect x="150" y="308" width="9" height="9" rx="1"/>
      <path d="M152 313l2.6 2.6 4.4-5"/>
    </g>
    <g fill="#D6CBCB">
      <rect x="168" y="274" width="168" height="4" rx="2"/>
      <rect x="168" y="292" width="140" height="4" rx="2"/>
      <rect x="168" y="310" width="184" height="4" rx="2"/>
    </g>
  </g>

  <!-- Certification badge -->
  <g transform="translate(372 296)">
    <circle r="34" fill="#FCF7F2" stroke="#A3222F" stroke-width="1.6"/>
    <circle r="27" fill="none" stroke="#A3222F" stroke-width=".8" stroke-dasharray="2 3"/>
    <path d="M-11 1l7.5 8L12-7" fill="none" stroke="#A3222F" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="150" y1="334" x2="278" y2="334" stroke="#2A1F21"/>
  <path d="M158 330c7-8 11 3 17-4s9 5 16-3" fill="none" stroke="#702732" stroke-width="1.5"
        stroke-linecap="round"/>
</svg>
